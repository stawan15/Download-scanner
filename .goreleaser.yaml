version: 2

before:
  hooks:
    - go test ./...

builds:
  - id: cleaner
    main: .
    binary: cleaner
    ldflags:
      - -s -w -X main.version={{ .Version }}
    goos: [darwin]
    goarch: [arm64, amd64]

archives:
  - id: default
    formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

brews:
  - name: download-inbox-cleaner
    ids:
      - default
    repository:
      owner: stawan15
      name: homebrew-tap
      branch: main
      token: "{{ .Env.TAP_GITHUB_TOKEN }}"
    homepage: https://github.com/stawan15/Download-scanner
    description: Cautious macOS Downloads-folder cleaner
    commit_author:
      name: github-actions[bot]
      email: 41898282+github-actions[bot]@users.noreply.github.com
    install: |
      bin.install "cleaner"
